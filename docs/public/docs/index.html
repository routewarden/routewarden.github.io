<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to Routewarden Documentation...</title>
  <meta http-equiv="refresh" content="0; url=/">
  <link rel="canonical" href="https://routewarden.github.io/">
  <script>
    const target = window.location.pathname.replace(/^\/docs\/?/, '/') + window.location.search + window.location.hash;
    window.location.replace(target || '/');
  </script>
</head>
<body>
  <p>Redirecting to <a href="/">Routewarden Documentation</a>...</p>
</body>
</html>
